<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Paquera 💛</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">💘 PAQUERA</div>
    <nav>
      <a href="index.html">Início</a>
    </nav>
  </header>

  <form id="formLogin">
    <h2>Bem-vindo(a) de volta 💛</h2>
    <input type="email" id="email" placeholder="Seu e-mail" required>
    <input type="password" id="senha" placeholder="Sua senha" required>
    <button type="submit" class="btn btn-dourado" style="width:100%;margin-top:0.5rem;">Entrar ✨</button>
    <p style="text-align:center;margin-top:1.5rem;color:rgba(247,231,206,0.7);">
      Ainda não tem conta? <a href="cadastro.html" style="color:#FFD700;text-decoration:none;font-weight:bold;">Criar agora</a>
    </p>
  </form>

  <script src="js/auth.js"></script>
</body>
</html>
