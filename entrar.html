/a></p></div></div><script src="/js/app.js"></script><script>document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("loginBtn");btn.textContent="Entrando...";btn.disabled=true;try{const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao entrar");localStorage.setItem("paquera_token",data.token);toast("Login realizado! ✅","success");setTimeout(()=>window.location.href="/descobrir.html",800)}catch(err){toast(err.message,"error");btn.textContent="Entrar";btn.disabled=false}});if(localStorage.getItem("paquera_token"))window.location.href="/descobrir.html";</script></body></html>
