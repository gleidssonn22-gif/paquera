<!DOCTYPE html><html lang="pt-BR"><head><script>window.addEventListener("load",function(){setTimeout(function(){var a=document.createElement("script");a.dataset.zone="12171808";a.src="https://al5sm.com/tag.min.js";document.body.appendChild(a)},3000)});</script><script>window.addEventListener("load",function(){setTimeout(function(){var q=document.createElement("script");q.src="https://quge5.com/88/tag.min.js";q.setAttribute("data-zone","304192");q.async=true;q.setAttribute("data-cfasync","false");document.body.appendChild(q)},3000)});</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Entrar — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><header><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/sobre.html">Sobre</a><a href="/cadastro.html">Cadastrar</a></div></nav></header><main><div style="max-width:400px;margin:100px auto;padding:0 20px;"><div style="background:var(--bg-card);padding:36px;border-radius:24px;border:1px solid rgba(255,255,255,0.04);"><h1 style="font-size:28px;margin-bottom:8px;text-align:center;">Bem-vindo de volta 💕</h1><p style="text-align:center;color:var(--text-muted);margin-bottom:28px;font-size:14px;">Entre para encontrar seu match</p><form id="loginForm"><div class="input-group"><label for="email">Email</label><input type="email" id="email" placeholder="seu@email.com" required></div><div class="input-group"><label for="password">Senha</label><input type="password" id="password" placeholder="Sua senha" required></div><button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Entrar</button></form><p style="text-align:center;margin-top:12px;"><a href="#" id="forgotLink" style="color:var(--primary);font-size:13px;text-decoration:none;font-weight:600;">Esqueci minha senha</a></p><div id="resetSection" style="display:none;background:var(--bg-input);padding:20px;border-radius:16px;margin-top:16px;"><h2 style="font-size:16px;margin-bottom:12px;">Recuperar senha 🔑</h2><div id="resetStep1"><div class="input-group"><input type="email" id="resetEmail" placeholder="Seu email" required></div><button type="button" class="btn btn-primary btn-sm" style="width:100%;" id="resetBtn1">Enviar código</button></div><div id="resetStep2" style="display:none;"><div class="input-group"><input type="text" id="resetToken" placeholder="Código recebido por email" required></div><div class="input-group"><input type="password" id="resetPassword" placeholder="Nova senha (mínimo 6 caracteres)" minlength="6" required></div><button type="button" class="btn btn-primary btn-sm" style="width:100%;" id="resetBtn2">Redefinir senha</button></div></div><p style="text-align:center;margin-top:20px;color:var(--text-muted);font-size:14px;">Não tem conta? <a href="/cadastro.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Cadastre-se grátis</a></p></div></div><script src="/js/app.js"></script><script>document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("loginBtn");btn.textContent="Entrando...";btn.disabled=true;try{const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao entrar");localStorage.setItem("paquera_token",data.token);toast("Login realizado! ✅","success");setTimeout(()=>window.location.href="/descobrir.html",800)}catch(err){toast(err.message,"error");btn.textContent="Entrar";btn.disabled=false}});if(localStorage.getItem("paquera_token"))window.location.href="/descobrir.html";</script><script>(function(){const sec=document.getElementById("resetSection");if(!sec)return;const link=document.getElementById("forgotLink");const btn1=document.getElementById("resetBtn1");const btn2=document.getElementById("resetBtn2");link.addEventListener("click",e=>{e.preventDefault();sec.style.display=sec.style.display==="none"?"block":"none"});btn1.addEventListener("click",async()=>{const email=document.getElementById("resetEmail").value.trim();if(!email)return toast("Informe seu email","error");btn1.disabled=true;btn1.textContent="Enviando...";try{const res=await fetch("/api/auth/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao enviar código");toast(data.message||"Se o e-mail estiver cadastrado, você receberá as instruções.","success");document.getElementById("resetStep1").style.display="none";document.getElementById("resetStep2").style.display="block"}catch(err){toast(err.message,"error")}finally{btn1.disabled=false;btn1.textContent="Enviar código"}});btn2.addEventListener("click",async()=>{const token=document.getElementById("resetToken").value.trim();const password=document.getElementById("resetPassword").value;if(!token||password.length<6)return toast("Informe o código do email e uma senha com 6+ caracteres","error");btn2.disabled=true;btn2.textContent="Redefinindo...";try{const res=await fetch("/api/auth/reset-confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao redefinir senha");toast("Senha alterada! Faça login. ✅","success");sec.style.display="none";link.style.display="none"}catch(err){toast(err.message,"error")}finally{btn2.disabled=false;btn2.textContent="Redefinir senha"}})})();</script></main></body></html>
