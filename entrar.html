<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Paquera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/" class="logo">💕 Paquera</a>
  <div class="nav-links">
    <a href="/entrar.html" class="active">Entrar</a>
    <a href="/cadastro.html">Cadastrar</a>
  </div>
</nav>

<div style="max-width:400px;margin:100px auto;padding:0 20px;">
  <div class="fade-in" style="background:var(--bg-card);padding:32px;border-radius:20px;">
    <h1 style="font-size:28px;margin-bottom:8px;">Bem-vindo de volta 👋</h1>
    <p style="color:var(--text-muted);margin-bottom:24px;">Entre para encontrar seu match</p>

    <form id="loginForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
    </form>

    <p style="text-align:center;margin-top:20px;color:var(--text-muted);">
      Não tem conta? <a href="/cadastro.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Cadastre-se</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });
    localStorage.setItem("paquera_token", data.token);
    window.location.href = "/descobrir.html";
  } catch (err) {
    toast(err.message, "error");
  }
});
</script>
</body>
</html>
