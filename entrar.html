<!DOCTYPE html><html lang="pt-BR"><head>

<script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml">

<title>Entrar — Paquera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<header><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/sobre.html">Sobre</a><a href="/planos.html">Planos</a><a href="/cadastro.html">Cadastrar</a></div></nav></header>
<main>
<div style="max-width:420px;margin:110px auto 60px;padding:0 20px;">
  <div class="fade-in" style="background:var(--bg-card);padding:40px 32px;border-radius:24px;border:1px solid rgba(255,255,255,0.06);box-shadow:var(--shadow);">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:44px;margin-bottom:8px;">💕</div>
      <h1 style="font-size:26px;font-weight:800;margin-bottom:6px;">Bem-vindo de volta</h1>
      <p style="color:var(--text-muted);font-size:14px;">Entre para encontrar seu match</p>
    </div>
    <form id="loginForm">
      <div class="input-group"><label for="email">Email</label><input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required></div>
      <div class="input-group"><label for="password">Senha</label><input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Entrar</button>
    </form>
    <div style="text-align:center;margin-top:16px;"><a href="#" id="forgotLink" style="color:var(--text-muted);font-size:13px;text-decoration:none;">Esqueci minha senha</a></div>
    <div id="resetBox" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);">
      <div class="input-group"><label for="resetEmail">Email para recuperação</label><input type="email" id="resetEmail" placeholder="seu@email.com"></div>
      <button class="btn btn-outline" style="width:100%;" id="resetBtn">Enviar link de recuperação</button>
    </div>
    <p style="text-align:center;margin-top:24px;color:var(--text-muted);font-size:14px;">Não tem conta? <a href="/cadastro.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Cadastre-se grátis</a></p>
  </div>
</div>
</main>
<script src="/js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("loginBtn");btn.textContent="Entrando...";btn.disabled=true;try{const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao entrar");localStorage.setItem("paquera_token",data.token);toast("Login realizado! ✅","success");setTimeout(()=>window.location.href="/descobrir.html",700)}catch(err){toast(err.message,"error");btn.textContent="Entrar";btn.disabled=false}});
document.getElementById("forgotLink").addEventListener("click",e=>{e.preventDefault();const b=document.getElementById("resetBox");b.style.display=b.style.display==="none"?"block":"none"});
document.getElementById("resetBtn").addEventListener("click",async()=>{const email=document.getElementById("resetEmail").value;if(!email)return toast("Digite seu email","error");try{const res=await fetch("/api/auth/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});const d=await res.json();toast(d.message||"Se o email existir, enviaremos instruções.","success")}catch(e){toast("Erro ao enviar","error")}});
if(localStorage.getItem("paquera_token"))window.location.href="/descobrir.html";
</script>
</body></html>
