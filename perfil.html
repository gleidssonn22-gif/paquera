<!DOCTYPE html><html lang="pt-BR"><head><script>window.addEventListener("load",function(){setTimeout(function(){var a=document.createElement("script");a.dataset.zone="12171808";a.src="https://al5sm.com/tag.min.js";document.body.appendChild(a)},3000)});</script><script>window.addEventListener("load",function(){setTimeout(function(){var q=document.createElement("script");q.src="https://quge5.com/88/tag.min.js";q.setAttribute("data-zone","304192");q.async=true;q.setAttribute("data-cfasync","false");document.body.appendChild(q)},3000)});</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Perfil — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><header><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/descobrir.html">Descobrir</a><a href="/matches.html">Matches</a><a href="/perfil.html" class="active">Perfil</a><a href="/notificacoes.html">🔔</a><a href="/configuracoes.html">⚙️</a></div></nav></header><div class="profile-container"><div class="profile-header"><img id="profilePhoto" src="https://ui-avatars.com/api/?background=6c5ce7&color=fff" alt=""><h2 id="profileName" style="font-size:22px;">Carregando...</h2><p id="profileInfo" style="color:var(--text-muted);font-size:14px;"></p><div style="margin-top:12px;"><span id="verifiedBadge" style="display:none;background:var(--success);color:white;padding:4px 12px;border-radius:10px;font-size:12px;">✔️ Verificado</span><span id="premiumBadge" style="display:none;background:var(--gradient);color:white;padding:4px 12px;border-radius:10px;font-size:12px;margin-left:4px;">⭐ Premium</span></div><div style="margin-top:16px;padding:12px;background:var(--bg-input);border-radius:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span style="color:var(--text-muted);">Completude do perfil</span><span id="completionPct" style="font-weight:700;color:var(--primary);">0%</span></div><div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden;"><div id="completionBar" style="height:100%;background:var(--gradient);border-radius:3px;width:0%;transition:width 0.8s ease;"></div></div></div><div style="display:flex;gap:12px;margin-top:16px;justify-content:center;"><div style="text-align:center;"><div id="statMatches" style="font-size:24px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div><div style="font-size:11px;color:var(--text-muted);">Matches</div></div><div style="text-align:center;"><div id="statLikes" style="font-size:24px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div><div style="font-size:11px;color:var(--text-muted);">Curtidas</div></div><div style="text-align:center;"><div id="statViews" style="font-size:24px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div><div style="font-size:11px;color:var(--text-muted);">Visitas</div></div></div></div><form id="profileForm" style="background:var(--bg-card);padding:24px;border-radius:20px;margin-top:16px;"><h3 style="margin-bottom:16px;">Editar Perfil</h3><div class="input-group"><label>Foto principal (URL)</label><input type="text" id="photo_url" placeholder="https://...foto.jpg"></div><div class="profile-photos"><div class="photo-slot" id="slot1">+</div><div class="photo-slot" id="slot2" title="Clique para adicionar foto">+</div><div class="photo-slot" id="slot3" title="Clique para adicionar foto">+</div></div><div class="input-group"><label>Bio</label><textarea id="bio" placeholder="Conte sobre você..."></textarea></div><div class="input-group"><label>Cidade</label><input type="text" id="city" placeholder="Sua cidade"></div><div class="input-group"><label>Buscando</label><select id="looking_for"><option value="both">Ambos</option><option value="male">Homens</option><option value="female">Mulheres</option><option value="other">Outros</option></select></div><div class="input-group"><label>Interesses (separados por vírgula)</label><input type="text" id="interests" placeholder="música, viagens, esportes..."></div><button type="submit" class="btn btn-primary" style="width:100%;">Salvar perfil</button></form><div style="display:flex;gap:8px;margin-top:16px;"><a href="/configuracoes.html" class="btn btn-outline" style="flex:1;">⚙️ Config</a><a href="/notificacoes.html" class="btn btn-outline" style="flex:1;">🔔 Notif</a></div><div style="text-align:center;margin-top:20px;"><button onclick="logout()" class="btn btn-outline" style="color:var(--danger);border-color:var(--danger);">Sair da conta</button></div></div><div class="bottom-nav"><a href="/descobrir.html"><span class="icon">🏠</span>Descobrir</a><a href="/matches.html"><span class="icon">💬</span>Matches</a><a href="/perfil.html" class="active"><span class="icon">👤</span>Perfil</a></div><script src="/js/app.js"></script><script>function escapeHtml(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}function calcAge(bd){if(!bd)return null;const t=new Date(bd).getTime();if(isNaN(t))return null;return Math.max(0,Math.floor((Date.now()-t)/(365.25*24*60*60*1000)))}function parseInterests(v){try{const a=JSON.parse(v);return Array.isArray(a)?a:[]}catch(e){return[]}}let currentProfile=null;function setSlot(el,url){if(url){el.innerHTML=`<img src="${escapeHtml(url)}" alt="Foto ${el.id}" style="width:100%;height:100%;object-fit:cover;">`}else{el.textContent="+"}}function renderProfile(p){document.getElementById("profileName").textContent=p.name||"";document.getElementById("profileInfo").textContent=`${p.city||"Sem cidade"} • ${p.gender||""}`;document.getElementById("profilePhoto").src=p.photo_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(p.name||"Eu")}&background=6c5ce7&color=fff`;if(p.is_verified)document.getElementById("verifiedBadge").style.display="inline-block";if(p.is_premium)document.getElementById("premiumBadge").style.display="inline-block";document.getElementById("photo_url").value=p.photo_url||"";document.getElementById("bio").value=p.bio||"";document.getElementById("city").value=p.city||"";document.getElementById("looking_for").value=p.looking_for||"both";document.getElementById("interests").value=parseInterests(p.interests).join(", ");setSlot(document.getElementById("slot2"),p.photo_url_2);setSlot(document.getElementById("slot3"),p.photo_url_3);let completion=10;if(p.photo_url)completion+=20;if(p.bio&&p.bio.length>10)completion+=20;if(p.city)completion+=15;if(parseInterests(p.interests).length>0)completion+=15;if(p.looking_for)completion+=10;if(calcAge(p.birth_date)!==null)completion+=10;setTimeout(()=>{document.getElementById("completionBar").style.width=completion+"%";document.getElementById("completionPct").textContent=completion+"%"},300)}async function loadProfile(){try{const p=await api("/profile");currentProfile=p;renderProfile(p)}catch(err){toast(err.message,"error")}}async function renderStats(){const sm=document.getElementById("statMatches"),sl=document.getElementById("statLikes"),sv=document.getElementById("statViews");try{const d=await api("/matches");sm.textContent=(d.matches||[]).length}catch(e){sm.textContent="0"}try{const d=await api("/profile/views");sv.textContent=(d.views||[]).length}catch(e){sv.textContent="0"}try{const d=await api("/daily-summary");sl.textContent=d.swipes||0}catch(e){sl.textContent="0"}}(async()=>{if(!await checkAuth())return;startOnlinePing();await loadProfile();renderStats()})();function wirePhotoSlot(n){const el=document.getElementById("slot"+n);el.addEventListener("click",async()=>{const cur=(currentProfile&&currentProfile["photo_url_"+n])||"";const url=prompt("URL da foto "+n+":",cur||"https://");if(url===null)return;const u=url.trim();if(!u)return;if(!/^https?:\/\//i.test(u)){toast("URL inválida (use http/https)","error");return}try{const body={};body["photo_url_"+n]=u;await api("/profile/update",{method:"POST",body:JSON.stringify(body)});toast("Foto atualizada! ✅","success");await loadProfile()}catch(err){toast(err.message,"error")}})}wirePhotoSlot(2);wirePhotoSlot(3);document.getElementById("profileForm").addEventListener("submit",async e=>{e.preventDefault();const interests=document.getElementById("interests").value.split(",").map(i=>i.trim()).filter(Boolean);try{await api("/profile/update",{method:"POST",body:JSON.stringify({photo_url:document.getElementById("photo_url").value,bio:document.getElementById("bio").value,city:document.getElementById("city").value,looking_for:document.getElementById("looking_for").value,interests:JSON.stringify(interests)})});toast("Perfil atualizado! ✅","success");await loadProfile()}catch(err){toast(err.message,"error")}});</script></body></html>
