<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Paquera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/" class="logo">💕 Paquera</a>
  <div class="nav-links">
    <a href="/entrar.html">Entrar</a>
    <a href="/cadastro.html" class="active">Cadastrar</a>
  </div>
</nav>

<div style="max-width:400px;margin:100px auto;padding:0 20px;">
  <div class="fade-in" style="background:var(--bg-card);padding:32px;border-radius:20px;">
    <h1 style="font-size:28px;margin-bottom:8px;">Criar conta ✨</h1>
    <p style="color:var(--text-muted);margin-bottom:24px;">Encontre seu match perfeito</p>

    <form id="registerForm">
      <div class="input-group">
        <label>Nome</label>
        <input type="text" id="name" placeholder="Seu nome" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
      </div>
      <div class="input-group">
        <label>Data de nascimento</label>
        <input type="date" id="birth_date" required>
      </div>
      <div class="input-group">
        <label>Gênero</label>
        <select id="gender">
          <option value="male">Masculino</option>
          <option value="female">Feminino</option>
          <option value="other">Outro</option>
        </select>
      </div>
      <div class="input-group">
        <label>Cidade</label>
        <input type="text" id="city" placeholder="Sua cidade">
      </div>
      <div class="input-group">
        <label>Buscando</label>
        <select id="looking_for">
          <option value="both">Ambos</option>
          <option value="male">Homens</option>
          <option value="female">Mulheres</option>
          <option value="other">Outros</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Criar conta grátis</button>
    </form>

    <p style="text-align:center;margin-top:20px;color:var(--text-muted);">
      Já tem conta? <a href="/entrar.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Entrar</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const data = await api("/auth/register", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        birth_date: document.getElementById("birth_date").value,
        gender: document.getElementById("gender").value,
        city: document.getElementById("city").value
      })
    });
    localStorage.setItem("paquera_token", data.token);
    window.location.href = "/perfil.html?new=1";
  } catch (err) {
    toast(err.message, "error");
  }
});
</script>
</body>
</html>
