<!DOCTYPE html><html lang="pt-BR"><head><script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Cadastro — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/sobre.html">Sobre</a><a href="/entrar.html">Entrar</a></div></nav><div style="max-width:400px;margin:100px auto;padding:0 20px 100px;"><div style="background:var(--bg-card);padding:36px;border-radius:24px;border:1px solid rgba(255,255,255,0.04);"><h1 style="font-size:28px;margin-bottom:8px;text-align:center;">Criar conta 💕</h1><p style="text-align:center;color:var(--text-muted);margin-bottom:28px;font-size:14px;">Encontre seu match perfeito</p><form id="registerForm"><div class="input-group"><label>Nome completo</label><input type="text" id="name" placeholder="Seu nome" required></div><div class="input-group"><label>Email</label><input type="email" id="email" placeholder="seu@email.com" required></div><div class="input-group"><label>Senha (mínimo 6 caracteres)</label><input type="password" id="password" placeholder="Sua senha" minlength="6" required></div><div class="input-group"><label>Data de nascimento</label><input type="date" id="birth_date" required></div><div class="input-group"><label>Gênero</label><select id="gender"><option value="female">Feminino</option><option value="male">Masculino</option><option value="other">Outro</option></select></div><div class="input-group"><label>Cidade</label><input type="text" id="city" placeholder="Sua cidade"></div><button type="submit" class="btn btn-primary" style="width:100%;" id="registerBtn">Criar conta grátis</button></form><p style="text-align:center;margin-top:20px;color:var(--text-muted);font-size:14px;">Já tem conta? <a href="/entrar.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Entrar</a></p><p style="text-align:center;margin-top:12px;color:var(--text-muted);font-size:11px;">Ao se cadastrar você concorda com nossos <a href="/termos.html" style="color:var(--text-muted);">Termos</a> e <a href="/privacidade.html" style="color:var(--text-muted);">Privacidade</a></p></div></div><script src="/js/app.js"></script><script>document.getElementById("registerForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("registerBtn");btn.textContent="Criando...";btn.disabled=true;try{const res=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value,birth_date:document.getElementById("birth_date").value,gender:document.getElementById("gender").value,city:document.getElementById("city").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao cadastrar");localStorage.setItem("paquera_token",data.token);toast("Conta criada! Bem-vindo! ✅","success");setTimeout(()=>window.location.href="/perfil.html",800)}catch(err){toast(err.message,"error");btn.textContent="Criar conta grátis";btn.disabled=false}});if(localStorage.getItem("paquera_token"))window.location.href="/descobrir.html";</script></body></html>
