<!DOCTYPE html><html lang="pt-BR"><head>
<script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script>
<title>Cadastro — Paquera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<header><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/sobre.html">Sobre</a><a href="/planos.html">Planos</a><a href="/entrar.html">Entrar</a></div></nav></header>
<main>
<div style="max-width:440px;margin:110px auto 80px;padding:0 20px;">
  <div class="fade-in" style="background:var(--bg-card);padding:40px 32px;border-radius:24px;border:1px solid rgba(255,255,255,0.06);box-shadow:var(--shadow);">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:44px;margin-bottom:8px;">✨</div>
      <h1 style="font-size:26px;font-weight:800;margin-bottom:6px;">Criar conta</h1>
      <p style="color:var(--text-muted);font-size:14px;">Encontre seu match perfeito</p>
    </div>
    <form id="registerForm">
      <div class="input-group"><label for="name">Nome completo</label><input type="text" id="name" placeholder="Seu nome" autocomplete="name" required></div>
      <div class="input-group"><label for="email">Email</label><input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required></div>
      <div class="input-group"><label for="password">Senha (mínimo 6 caracteres)</label><input type="password" id="password" placeholder="Sua senha" minlength="6" autocomplete="new-password" required></div>
      <div class="input-group"><label for="birth_date">Data de nascimento</label><input type="date" id="birth_date" required></div>
      <div class="input-group"><label for="gender">Gênero</label><select id="gender"><option value="female">Feminino</option><option value="male">Masculino</option><option value="other">Outro</option></select></div>
      <div class="input-group"><label for="city">Cidade</label><input type="text" id="city" placeholder="Sua cidade" autocomplete="address-level2"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="registerBtn">Criar conta grátis</button>
    </form>
    <p style="text-align:center;margin-top:24px;color:var(--text-muted);font-size:14px;">Já tem conta? <a href="/entrar.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Entrar</a></p>
    <p style="text-align:center;margin-top:12px;color:var(--text-muted);font-size:11px;">Ao se cadastrar você concorda com os <a href="/termos.html" style="color:var(--text-muted);">Termos</a> e a <a href="/privacidade.html" style="color:var(--text-muted);">Privacidade</a></p>
  </div>
</div>
</main>
<script src="/js/app.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit",async e=>{e.preventDefault();const bd=document.getElementById("birth_date").value;if(bd){const age=Math.floor((Date.now()-new Date(bd).getTime())/(365.25*24*60*60*1000));if(age<18)return toast("Você precisa ter 18 anos ou mais","error")}const btn=document.getElementById("registerBtn");btn.textContent="Criando...";btn.disabled=true;try{const res=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value,birth_date:bd,gender:document.getElementById("gender").value,city:document.getElementById("city").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao cadastrar");localStorage.setItem("paquera_token",data.token);toast("Conta criada! Bem-vindo! ✅","success");setTimeout(()=>window.location.href="/perfil.html",700)}catch(err){toast(err.message,"error");btn.textContent="Criar conta grátis";btn.disabled=false}});
if(localStorage.getItem("paquera_token"))window.location.href="/descobrir.html";
</script>
</body></html>
