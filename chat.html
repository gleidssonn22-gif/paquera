<!DOCTYPE html><html lang="pt-BR"><head><script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Chat — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/matches.html">Voltar</a></div></nav><div class="chat-container"><div class="chat-header"><a href="/matches.html" style="text-decoration:none;color:var(--text);font-size:20px;margin-right:8px;">←</a><img id="chatPhoto" src="https://ui-avatars.com/api/?background=6c5ce7&color=fff" alt=""><div><div class="name" id="chatName">Carregando...</div><div class="status" id="chatStatus">offline</div></div></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input"><input type="text" id="msgInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()" aria-label="Enviar mensagem">➤</button></div></div><script src="/js/app.js"></script><script>let matchId=new URLSearchParams(location.search).get("match_id");let myId;let ws=null;let pollTimer=null;function escapeHtml(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}function appendMsg(m){const msgs=document.getElementById("chatMessages");const empty=msgs.querySelector(".empty-state");if(empty)empty.remove();msgs.innerHTML+=`<div class="chat-msg ${m.sender_id==myId?'sent':'received'}">${escapeHtml(m.content)}</div>`;msgs.scrollTop=msgs.scrollHeight}function renderHistory(list){const msgs=document.getElementById("chatMessages");msgs.innerHTML=list.length?"":'<div class="empty-state" style="padding:40px 20px;"><div class="icon">💬</div><h3>Diga olá!</h3><p>Envie a primeira mensagem</p></div>';list.forEach(appendMsg);msgs.scrollTop=msgs.scrollHeight}async function loadHistory(){try{const msgData=await api("/matches/messages?match_id="+encodeURIComponent(matchId));renderHistory(msgData.messages||[])}catch(err){toast(err.message,"error")}}function startPollFallback(){if(pollTimer)return;pollTimer=setInterval(async()=>{try{const d=await api("/matches/messages?match_id="+encodeURIComponent(matchId));renderHistory(d.messages||[])}catch(e){}},15000)}function connectWS(){if(!matchId)return;try{ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/api/chat?match_id="+encodeURIComponent(matchId)+"&token="+encodeURIComponent(localStorage.getItem("paquera_token")||""));ws.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.type==="message"&&d.sender_id!=myId)appendMsg(d)}catch(e){}};ws.onclose=()=>{startPollFallback()};ws.onerror=()=>{try{if(ws)ws.close()}catch(e){}}}catch(e){startPollFallback()}}async function sendMessage(){const input=document.getElementById("msgInput");const btn=document.querySelector(".chat-input button");const text=input.value.trim();if(!text||input.disabled)return;input.value="";input.disabled=true;if(btn)btn.disabled=true;try{const res=await fetch("/api/chat?match_id="+encodeURIComponent(matchId),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+authToken},body:JSON.stringify({content:text})});if(!res.ok){let msg="Erro ao enviar";try{const d=await res.json();msg=d.error||msg}catch(e){}throw new Error(msg)}appendMsg({sender_id:myId,content:text})}catch(err){toast(err.message||"Erro ao enviar","error");input.value=text}finally{input.disabled=false;if(btn)btn.disabled=false;input.focus()}}async function init(){if(!await checkAuth())return;startOnlinePing();myId=currentUser.id;if(!matchId){window.location.href="/matches.html";return}try{const matches=await api("/matches");const m=matches.matches.find(x=>x.match_id==matchId);if(!m){window.location.href="/matches.html";return}document.getElementById("chatName").textContent=m.name;document.getElementById("chatPhoto").src=m.photo_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&size=120&background=6c5ce7&color=fff`;document.getElementById("chatStatus").textContent=m.is_online?"online":"offline"}catch(err){toast(err.message,"error")}await loadHistory();connectWS()}init();</script></body></html>
