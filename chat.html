<!DOCTYPE html><html lang="pt-BR"><head>
<script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script>
<title>Chat — Paquera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<header><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/matches.html">← Matches</a></div></nav></header>
<main>
<div class="chat-container">
  <div class="chat-header"><a href="/matches.html" style="text-decoration:none;color:var(--text);font-size:20px;margin-right:8px;">←</a><img id="chatPhoto" src="https://ui-avatars.com/api/?background=6c5ce7&color=fff" alt="Foto do match"><div><div class="name" id="chatName">Carregando...</div><div class="status" id="chatStatus">offline</div></div></div>
  <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
  <div class="chat-input"><input type="text" id="msgInput" placeholder="Digite uma mensagem..." aria-label="Mensagem" onkeypress="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()" aria-label="Enviar mensagem">➤</button></div>
</div>
</main>
<script src="/js/app.js"></script>
<script>
let matchId=new URLSearchParams(location.search).get("match_id");let myId;
async function init(){if(!await checkAuth())exit();startOnlinePing();myId=currentUser.id;if(!matchId){window.location.href="/matches.html";return}try{const matches=await api("/matches");const m=matches.matches.find(x=>x.match_id==matchId);if(m){document.getElementById("chatName").textContent=m.name;document.getElementById("chatPhoto").src=m.photo_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&size=120&background=6c5ce7&color=fff`;document.getElementById("chatStatus").textContent=m.is_online?"online":"offline"}const md=await api("/matches/messages?match_id="+matchId);const box=document.getElementById("chatMessages");if(md.messages&&md.messages.length>0){box.innerHTML=md.messages.map(x=>`<div class="chat-msg ${x.sender_id==myId?'sent':'received'}">${escHtml(x.content)}</div>`).join("");box.scrollTop=box.scrollHeight}else{box.innerHTML='<div class="empty-state" style="padding:40px 20px;"><div class="icon">💬</div><h3>Diga olá!</h3><p>Envie a primeira mensagem</p></div>'}}catch(err){toast(err.message,"error")}}
async function sendMessage(){const input=document.getElementById("msgInput");const text=input.value.trim();if(!text)return;input.value="";const box=document.getElementById("chatMessages");box.innerHTML+=`<div class="chat-msg sent">${escHtml(text)}</div>`;box.scrollTop=box.scrollHeight;try{await fetch("/api/chat?match_id="+matchId,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+authToken},body:JSON.stringify({content:text})})}catch(err){toast("Erro ao enviar","error")}}
init();
</script>
</body></html>
