<!DOCTYPE html><html lang="pt-BR"><head><script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Chat — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/matches.html">Voltar</a></div></nav><div class="chat-container"><div class="chat-header"><a href="/matches.html" style="text-decoration:none;color:var(--text);font-size:20px;margin-right:8px;">←</a><img id="chatPhoto" src="https://ui-avatars.com/api/?background=6c5ce7&color=fff" alt=""><div><div class="name" id="chatName">Carregando...</div><div class="status" id="chatStatus">offline</div></div></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input"><input type="text" id="msgInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">➤</button></div></div><script src="/js/app.js"></script><script>let matchId=new URLSearchParams(location.search).get("match_id");let myId;async function init(){if(!await checkAuth())exit();startOnlinePing();myId=currentUser.id;if(!matchId){window.location.href="/matches.html";return}try{const matches=await api("/matches");const m=matches.matches.find(x=>x.match_id==matchId);if(m){document.getElementById("chatName").textContent=m.name;document.getElementById("chatPhoto").src=m.photo_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&size=120&background=6c5ce7&color=fff`;document.getElementById("chatStatus").textContent=m.is_online?"online":"offline"}const msgData=await api("/matches/messages?match_id="+matchId);const msgs=document.getElementById("chatMessages");if(msgData.messages&&msgData.messages.length>0){msgs.innerHTML=msgData.messages.map(m=>`<div class="chat-msg ${m.sender_id==myId?'sent':'received'}">${escapeHtml(m.content)}</div>`).join("");msgs.scrollTop=msgs.scrollHeight}else{msgs.innerHTML='<div class="empty-state" style="padding:40px 20px;"><div class="icon">💬</div><h3>Diga olá!</h3><p>Envie a primeira mensagem</p></div>'}}catch(err){toast(err.message,"error")}}function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}async function sendMessage(){const input=document.getElementById("msgInput");const text=input.value.trim();if(!text)return;input.value="";const msgs=document.getElementById("chatMessages");msgs.innerHTML+=`<div class="chat-msg sent">${escapeHtml(text)}</div>`;msgs.scrollTop=msgs.scrollHeight;try{await fetch("/api/chat?match_id="+matchId,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+authToken},body:JSON.stringify({content:text})})}catch(err){toast("Erro ao enviar","error")}}init();</script></body></html>
