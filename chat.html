<!DOCTYPE html><html lang="pt-BR"><head><script>(function(s){s.dataset.zone='12171808',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Chat — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/descobrir.html">Descobrir</a><a href="/matches.html" class="active">Matches</a><a href="/perfil.html">Perfil</a></div></nav><div class="chat-container"><div class="chat-header" id="chatHeader"><a href="/matches.html" style="color:var(--text-muted);text-decoration:none;font-size:20px;">←</a><img id="matchPhoto" src="https://ui-avatars.com/api/?background=6c5ce7&color=fff" alt=""><div><div class="name" id="matchName">Carregando...</div><div class="status" id="matchStatus"></div></div></div><div class="chat-messages" id="chatMessages"></div><div id="iceBreakers" style="padding:0 16px 8px;display:flex;gap:8px;flex-wrap:wrap;"></div><div class="chat-input"><input type="text" id="msgInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">➤</button></div></div><script src="/js/app.js"></script><script>const matchId=new URLSearchParams(location.search).get("match_id");let ws,hasMessages=false;const iceBreakers=["Oi! Tudo bem? 😊","Curti seu perfil! 📸","De onde você é? 🌍","Qual sua música favorita? 🎵","O que gosta de fazer? 🎯","Bora conversar? 💬"];(async()=>=>{if(!await checkAuth())exit();startOnlinePing();try{const data=await api("/matches");const match=data.matches.find(m=>m.match_id==matchId);if(match){document.getElementById("matchName").textContent=match.name;document.getElementById("matchPhoto").src=match.photo_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(match.name)}&background=6c5ce7&color=fff`;document.getElementById("matchStatus").textContent=match.is_online?"Online":"Offline"}}catch(e){}try{const msgData=await api(`/matches/messages?match_id=${matchId}`);renderMessages(msgData.messages);if(msgData.messages.length===0)showIceBreakers()}catch(e){}try{const wsUrl=`wss://${location.host}/api/chat?match_id=${matchId}`;ws=new WebSocket(wsUrl,["websocket"]);ws.onmessage=e=>{const data=JSON.parse(e.data);if(data.type==="message"){appendMessage(data.content,"received");document.getElementById("iceBreakers").innerHTML=""}};ws.onopen=()=>console.log("WS connected")}catch(e){setInterval(async()=>{const msgData=await api(`/matches/messages?match_id=${matchId}`);renderMessages(msgData.messages)},5000)}})();function showIceBreakers(){document.getElementById("iceBreakers").innerHTML=iceBreakers.map(ib=>`<span style="background:var(--bg-input);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='var(--gradient)';this.style.color='#fff'" onmouseout="this.style.background='var(--bg-input)';this.style.color=''" onclick="sendIceBreaker('${ib}')">${ib}</span>`).join("")}function sendIceBreaker(text){document.getElementById("msgInput").value=text;sendMessage()}function renderMessages(messages){const container=document.getElementById("chatMessages");container.innerHTML=messages.map(m=>{const sent=m.sender_id===currentUser.id;return `<div class="chat-msg ${sent?"sent":"received"}">${escapeHtml(m.content)}${sent?'<div style="font-size:10px;text-align:right;margin-top:2px;opacity:0.7;">'+(m.read_at?'✓✓ Lida':'✓ Enviada')+'</div>':''}</div>`}).join("");container.scrollTop=container.scrollHeight;if(messages.length>0){document.getElementById("iceBreakers").innerHTML=""}}function appendMessage(content,type){const container=document.getElementById("chatMessages");const msg=document.createElement("div");msg.className=`chat-msg ${type}`;if(type==="sent")msg.innerHTML=content+'<div style="font-size:10px;text-align:right;margin-top:2px;opacity:0.7;">✓ Enviada</div>';else msg.textContent=content;container.appendChild(msg);container.scrollTop=container.scrollHeight}async function sendMessage(){const input=document.getElementById("msgInput");const content=input.value.trim();if(!content)return;appendMessage(content,"sent");input.value="";document.getElementById("iceBreakers").innerHTML="";try{if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify({content}))}else{await api(`/chat?match_id=${matchId}`,{method:"POST",body:JSON.stringify({content})})}}catch(e){toast("Erro ao enviar","error")}}function escapeHtml(text){const d=document.createElement("div");d.textContent=text;return d.innerHTML}</script></body></html>
