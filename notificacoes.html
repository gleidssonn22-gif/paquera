<!DOCTYPE html><html lang="pt-BR"><head><script>window.addEventListener("load",function(){setTimeout(function(){var a=document.createElement("script");a.dataset.zone="12171808";a.src="https://al5sm.com/tag.min.js";document.body.appendChild(a)},3000)});</script><script>window.addEventListener("load",function(){setTimeout(function(){var q=document.createElement("script");q.src="https://quge5.com/88/tag.min.js";q.setAttribute("data-zone","304192");q.async=true;q.setAttribute("data-cfasync","false");document.body.appendChild(q)},3000)});</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Notificações — Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/descobrir.html">Descobrir</a><a href="/matches.html">Matches</a><a href="/perfil.html">Perfil</a><a href="/configuracoes.html">⚙️</a></div></nav><div class="matches-list"><h1 style="font-size:28px;margin-bottom:20px;">🔔 Notificações</h1><div id="notifs"><div class="empty-state"><div class="icon skeleton" style="width:100%;height:60px;border-radius:16px;"></div><p style="margin-top:16px;">Carregando...</p></div></div></div><div class="bottom-nav"><a href="/descobrir.html"><span class="icon">🏠</span>Descobrir</a><a href="/matches.html"><span class="icon">💬</span>Matches</a><a href="/perfil.html"><span class="icon">👤</span>Perfil</a></div><script src="/js/app.js"></script><script>function escapeHtml(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}function timeAgo(sec){const n=parseInt(sec);if(!n||isNaN(n))return "agora";let diff=Math.floor(Date.now()/1000)-n;if(diff<0)diff=0;if(diff<60)return "agora";if(diff<3600)return Math.floor(diff/60)+" min";if(diff<86400)return Math.floor(diff/3600)+" h";return Math.floor(diff/86400)+" d"}function metaFor(n){const t=String(n.type||"").toLowerCase();switch(t){case "match":return {icon:"💕",color:"var(--primary)",link:"/matches.html"};case "message":return {icon:"💬",color:"var(--secondary)",link:null};case "super_like":case "superlike":return {icon:"⭐",color:"var(--info)",link:"/matches.html"};case "view":case "profile_view":return {icon:"👀",color:"var(--warning)",link:"/perfil.html"};case "gift":return {icon:"🎁",color:"var(--accent)",link:"/matches.html"};default:return {icon:"🔔",color:"var(--secondary)",link:"/matches.html"}}}(async()=>{if(!await checkAuth())return;startOnlinePing();const notifs=document.getElementById("notifs");try{const data=await api("/notifications");const list=data.notifications||[];if(!list.length){notifs.innerHTML='<div class="empty-state"><div class="icon">🌱</div><h3>Nenhuma notificação ainda</h3><p>Interaja com pessoas para receber novidades!</p></div>';return}notifs.innerHTML=list.map(n=>{const mt=metaFor(n);let link=mt.link;if(n.type==="message"){if(n.match_id)link="/chat.html?match_id="+encodeURIComponent(n.match_id);else link="/matches.html"}const title=n.title||"Novidade!";const body=n.body||"";return `<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;margin-bottom:8px;background:var(--bg-card);cursor:pointer;transition:all 0.2s;border:1px solid rgba(255,255,255,0.03);" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='var(--bg-card)'" onclick="window.location.href='${link}'"><div style="width:48px;height:48px;border-radius:14px;background:${mt.color}22;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">${mt.icon}</div><div style="flex:1;"><div style="font-weight:600;font-size:14px;">${escapeHtml(title)} ${n.read?"":'<span style="font-size:10px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:8px;vertical-align:middle;">novo</span>'}</div><div style="font-size:13px;color:var(--text-muted);">${escapeHtml(body)}</div></div><div style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${timeAgo(n.created_at)}</div></div>`}).join("")}catch(err){notifs.innerHTML='<div class="empty-state"><div class="icon">🌱</div><h3>Nenhuma notificação ainda</h3><p>Interaja com pessoas para receber novidades!</p></div>'}})();</script></body></html>
