<script src="https://quge5.com/88/tag.min.js" data-zone="304192" async data-cfasync="false"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ff4458">

<title>Descobrir — Paquera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<header><nav class="navbar"><a href="/" class="logo">💕 Paquera</a><div class="nav-links"><a href="/descobrir.html" class="active">Descobrir</a><a href="/matches.html">Matches</a><a href="/perfil.html">Perfil</a><a href="/notificacoes.html">🔔</a></div></nav></header>
<main>
<div style="position:fixed;top:70px;right:16px;z-index:60;"><a href="/filtros.html" style="display:flex;align-items:center;gap:6px;background:var(--bg-card);padding:10px 16px;border-radius:12px;text-decoration:none;color:var(--text);font-size:13px;font-weight:600;box-shadow:var(--shadow);">🔍 Filtros</a></div>
<div class="swipe-container" id="swipeContainer"><div class="empty-state"><div class="icon skeleton" style="width:200px;height:300px;border-radius:20px;"></div><p style="margin-top:16px;">Carregando perfis...</p></div></div>
<div class="swipe-actions"><button class="swipe-btn pass" aria-label="Pular perfil" onclick="deck.pass()">❌</button><button class="swipe-btn super" aria-label="Enviar super like" onclick="superLike()">⭐</button><button class="swipe-btn like" aria-label="Curtir perfil" onclick="deck.like()">💚</button></div>
</main>
<div class="bottom-nav"><a href="/descobrir.html" class="active"><span class="icon">🏠</span>Descobrir</a><a href="/matches.html"><span class="icon">💬</span>Matches</a><a href="/perfil.html"><span class="icon">👤</span>Perfil</a></div>
<script src="/js/app.js"></script>
<script>
let deck;
(async()=>{if(!await checkAuth())exit();startOnlinePing();try{const data=await api("/discover");deck=new SwipeDeck(document.getElementById("swipeContainer"),data.profiles,async(t,a)=>{try{return await api("/swipe",{method:"POST",body:JSON.stringify({target_id:t,action:a})})}catch(e){return{matched:false}}})}catch(err){document.getElementById("swipeContainer").innerHTML='<div class="empty-state"><div class="icon">💔</div><h3>Nenhum perfil</h3><p>Volte mais tarde!</p></div>'}})();
async function superLike(){if(!deck||!deck.profiles[deck.index])return;const p=deck.profiles[deck.index];try{const r=await api("/superlike",{method:"POST",body:JSON.stringify({target_id:p.id})});toast("Super like enviado! ⭐","success");if(r.matched)showMatchPopup(p);deck.index++;deck.render()}catch(e){toast(e.message,"error")}}
</script>
</body></html>
