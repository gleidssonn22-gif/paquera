<body>
<nav class="navbar">
  <a href="/" class="logo">💕 Paquera</a>
  <div class="nav-links">
    <a href="/descobrir.html" class="active">Descobrir</a>
    <a href="/matches.html">Matches</a>
    <a href="/perfil.html">Perfil</a>
  </div>
</nav>

<div class="swipe-container" id="swipeContainer"></div>

<div class="swipe-actions">
  <button class="swipe-btn pass" onclick="deck.pass()">✕</button>
  <button class="swipe-btn super" onclick="toast('Super like enviado! 💙','success')">⭐</button>
  <button class="swipe-btn like" onclick="deck.like()">♥</button>
</div>

<div class="bottom-nav">
  <a href="/descobrir.html" class="active"><span class="icon">🏠</span>Descobrir</a>
  <a href="/matches.html"><span class="icon">💬</span>Matches</a>
  <a href="/perfil.html"><span class="icon">👤</span>Perfil</a>
</div>

<script src="/js/app.js"></script>
<script>
let deck;
(async () => {
  if (!await checkAuth()) exit();
  startOnlinePing();

  try {
    const data = await api("/discover");
    deck = new SwipeDeck(
      document.getElementById("swipeContainer"),
      data.profiles,
      async (targetId, action) => {
        return await api("/swipe", {
          method: "POST",
          body: JSON.stringify({ target_id: targetId, action })
        });
      }
    );
  } catch (err) {
    toast(err.message, "error");
  }
})();
</script>
