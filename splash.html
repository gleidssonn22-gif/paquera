<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Paquera</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;font-family:'Poppins',sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.splash{position:relative;z-index:1;text-align:center}.splash .heart{font-size:80px;animation:beat 1s infinite;display:inline-block}.splash h1{font-size:42px;font-weight:900;background:linear-gradient(135deg,#ff4458,#fd79a8,#6c5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:16px;animation:fadeIn 0.5s}.splash .loader{width:120px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin:24px auto 0;overflow:hidden}.splash .loader::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(135deg,#ff4458,#6c5ce7);border-radius:2px;animation:load 1.2s infinite}body::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,rgba(255,68,88,0.08),transparent 50%),radial-gradient(circle at 80% 70%,rgba(108,92,231,0.08),transparent 50%);animation:bgFloat 20s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.15)}75%{transform:scale(0.95)}}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes bgFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(-30px,30px)}66%{transform:translate(30px,-30px)}}</style></head><body><div class="splash"><div class="heart">💕</div><h1>Paquera</h1><div class="loader"></div></div><script>setTimeout(()=>{const token=localStorage.getItem("paquera_token");window.location.href=token?"/descobrir.html":"/index.html"},1800)</script></body></html>
